<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Florida Wetlands — Types & Toggles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <style>
    html, body, #map {height:100%; margin:0}
    .panel {
      position:absolute; top:10px; left:10px; z-index:2;
      background:#fff; border-radius:10px; padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.15);
      max-height:70%; overflow:auto; font-family:system-ui, sans-serif; font-size:14px;
    }
    .row {display:flex; align-items:center; gap:8px; margin:4px 0;}
    .swatch {width:14px; height:14px; border-radius:3px; border:1px solid #888;}
    .panel h3 {margin:0 0 8px 0; font-size:15px;}
    .btns {display:flex; gap:8px; margin-bottom:6px}
    button {cursor:pointer; padding:4px 8px; border-radius:6px; border:1px solid #bbb; background:#f7f7f7}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h3>Wetland Types</h3>
  <div class="btns">
    <button id="selectAll">Select all</button>
    <button id="clearAll">Clear all</button>
  </div>
  <div id="typeList">Loading…</div>
  <div class="hr" style="height:1px;background:#eee;margin:10px 0;"></div>
  <h3>ERP permits</h3>
  
  <div class="row">
    <span class="swatch" style="background:#ff4fa3"></span>
    <input id="toggleBuilder" type="checkbox" checked>
    <label for="toggleBuilder">Builder ERPs (pink)</label>
  </div>
  
  <div class="row">
    <span class="swatch" style="background:#ff9f1c"></span>
    <input id="toggleNonBuilder" type="checkbox" checked>
    <label for="toggleNonBuilder">Other ERPs (orange)</label>
  </div>
  
  <div class="btns" style="margin-top:6px">
    <button id="showOnlyBuilder">Show only builder</button>
    <button id="showAllErp">Show all ERPs</button>
  </div>
    <div class="btns" style="margin-top:6px">
    <button id="showOnlyBuilder">Show only builder</button>
    <button id="showAllErp">Show all ERPs</button>
  </div>

  <div class="hr" style="height:1px;background:#eee;margin:10px 0;"></div>
    <h3>Flooded days (per pixel, 2013)</h3>
    <div id="floodBucketList">
      <div class="row">
        <span class="swatch" style="background:#edf8fb"></span>
        <input id="bucket_1_2" type="checkbox" checked>
        <label for="bucket_1_2">1–2 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#ccece6"></span>
        <input id="bucket_3_5" type="checkbox" checked>
        <label for="bucket_3_5">3–5 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#a8ddb5"></span>
        <input id="bucket_6_10" type="checkbox" checked>
        <label for="bucket_6_10">6–10 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#7bccc4"></span>
        <input id="bucket_11_20" type="checkbox" checked>
        <label for="bucket_11_20">11–20 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#4eb3d3"></span>
        <input id="bucket_21_50" type="checkbox" checked>
        <label for="bucket_21_50">21–50 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#2b8cbe"></span>
        <input id="bucket_51_100" type="checkbox" checked>
        <label for="bucket_51_100">51–100 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#0868ac"></span>
        <input id="bucket_101_200" type="checkbox" checked>
        <label for="bucket_101_200">101–200 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#084081"></span>
        <input id="bucket_201_300" type="checkbox" checked>
        <label for="bucket_201_300">201–300 days</label>
      </div>
      <div class="row">
        <span class="swatch" style="background:#4d004b"></span>
        <input id="bucket_301_364" type="checkbox" checked>
        <label for="bucket_301_364">301–364 days</label>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
<script>
  // ---- CONFIG ----
  const PMTILES_URL = "pmtiles://https://ehale-ehale.github.io/sjrwmd-wetlands-development/wetlands.pmtiles";
  const FLOOD_PMTILES_URL = "pmtiles://https://ehale-ehale.github.io/sjrwmd-wetlands-development/volusia_flood_days_cells_2013.pmtiles";
  const SOURCE_ID = "wetlands";
  const SOURCE_LAYER = "wetlands";   // tippecanoe -l name (default we used)
  const TYPE_FIELD = "type";

  // ---- Map init ----
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      "version": 8,
      "sources": {
        [SOURCE_ID]: { "type": "vector", "url": PMTILES_URL }
      },
      "layers": [
        {
          "id": "wetlands-fill",
          "type": "fill",
          "source": SOURCE_ID,
          "source-layer": SOURCE_LAYER,
          "paint": {
            "fill-color": "#66bb6a",     // temporary; we’ll set data-driven color after discovery
            "fill-opacity": 0.35
          },
          "filter": ["in", ["get", TYPE_FIELD], ["literal", []]] // start empty; we'll populate
        },
        {
          "id": "wetlands-outline",
          "type": "line",
          "source": SOURCE_ID,
          "source-layer": SOURCE_LAYER,
          "paint": { "line-color": "#22663f", "line-width": 0.6 },
          "filter": ["in", ["get", TYPE_FIELD], ["literal", []]]
        }
      ]
    },
    center: [-81.5, 28.5],
    zoom: 6
  });

  // ---- Helpers ----
  // Stable color from string via simple hash → HSL
  function colorForType(s){
    let h=0;
    for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
    const hue = h % 360;
    return `hsl(${hue},60%,55%)`;
  }

  function buildColorExpression(types){
    // ["match", ["get","type"], "A", "#..", "B", "#..", ... , "#ccc"]
    const expr = ["match", ["get", TYPE_FIELD]];
    types.forEach(t => { expr.push(t, colorForType(t)); });
    expr.push("#cccccc"); // fallback
    return expr;
  }

  function setSelectedTypes(selected){
    const list = Array.from(selected);
    const filter = ["in", ["get", TYPE_FIELD], ["literal", list]];
    map.setFilter("wetlands-fill", filter);
    map.setFilter("wetlands-outline", filter);
  }

  function renderUI(types, selected){
    const container = document.getElementById("typeList");
    container.innerHTML = "";
    types.sort((a,b)=>a.localeCompare(b));
    types.forEach(t=>{
      const row = document.createElement("div"); row.className="row";
      const sw = document.createElement("span"); sw.className="swatch"; sw.style.background=colorForType(t);
      const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = selected.has(t);
      cb.addEventListener("change", ()=>{
        if(cb.checked) selected.add(t); else selected.delete(t);
        setSelectedTypes(selected);
      });
      const label = document.createElement("label"); label.textContent = t || "(blank)";
      row.appendChild(sw); row.appendChild(cb); row.appendChild(label);
      container.appendChild(row);
    });

    document.getElementById("selectAll").onclick = ()=>{ selected = new Set(types); setSelectedTypes(selected); container.querySelectorAll("input[type=checkbox]").forEach(el=>el.checked=true); };
    document.getElementById("clearAll").onclick  = ()=>{ selected = new Set();       setSelectedTypes(selected); container.querySelectorAll("input[type=checkbox]").forEach(el=>el.checked=false); };

    // set color expression now that we know the types
    map.setPaintProperty("wetlands-fill", "fill-color", buildColorExpression(types));
  }

  // Discover types by querying visible source features once tiles load.
  map.on("idle", ()=>{
    if (!map.getLayer("wetlands-fill")) return;

    // If we've already built UI, skip
    if (map.__typesReady) return;

    const feats = map.querySourceFeatures(SOURCE_ID, {sourceLayer: SOURCE_LAYER});
    const types = new Set();
    for (const f of feats){
      const v = f.properties?.[TYPE_FIELD];
      if (typeof v === "string" && v.length) types.add(v);
    }

    // If nothing visible yet (e.g., not all tiles loaded), try again later.
    if (types.size === 0) return;

    map.__typesReady = true;

    // Default: everything ON
    let selected = new Set(types);
    renderUI(Array.from(types), selected);
    setSelectedTypes(selected);
  });
</script>
<script>
  // === ERP + Builder from combined PMTiles ===
  // Make sure this points to your uploaded file:
  const COMBINED_PMTILES_URL = "pmtiles://https://ehale-ehale.github.io/sjrwmd-wetlands-development/combined.pmtiles";
    // Flood-day buckets (must match the "bucket" values in your PMTiles)
  const FLOOD_BUCKETS = [
    "1-2",
    "3-5",
    "6-10",
    "11-20",
    "21-50",
    "51-100",
    "101-200",
    "201-300",
    "301-364",
  ];

  // Colors for each bucket (aligned with panel swatches)
  const FLOOD_BUCKET_COLORS = {
    "1-2": "#edf8fb",
    "3-5": "#ccece6",
    "6-10": "#a8ddb5",
    "11-20": "#7bccc4",
    "21-50": "#4eb3d3",
    "51-100": "#2b8cbe",
    "101-200": "#0868ac",
    "201-300": "#084081",
    "301-364": "#4d004b",
  };


  // Layer names (from tippecanoe -L erp_permits:..., -L builder_addresses:...)
  const LAYER_ERP     = "erp_permits";
  const LAYER_BUILDER = "builder_addresses";

  map.on("load", () => {
    // 1) Add the combined vector source
    map.addSource("combined", { type: "vector", url: COMBINED_PMTILES_URL });

    // 2) Builder points (magenta dots)
    map.addLayer({
      id: "builder-points",
      type: "circle",
      source: "combined",
      "source-layer": LAYER_BUILDER,
      filter: ["==", ["geometry-type"], "Point"],
      paint: {
        "circle-radius": [
          "interpolate", ["linear"], ["zoom"],
          5, 3,
          10, 5,
          14, 8
        ],
        "circle-color": "#ff00c8",
        "circle-stroke-color": "#ffffff",
        "circle-stroke-width": 1.2,
        "circle-opacity": 0.9
      }
    });

    // 3) ERP polygons — fill color depends on whether they contain a builder address
    //     has_builder_addr === true  -> pink
    //     otherwise                  -> orange
    map.addLayer({
      id: "erp-fill",
      type: "fill",
      source: "combined",
      "source-layer": LAYER_ERP,
      filter: ["in", ["geometry-type"], ["literal", ["Polygon","MultiPolygon"]]],
      paint: {
        "fill-color": [
          "case",
          ["==", ["get","has_builder_addr"], true], "#ff4fa3",  // pink
          "#ff9f1c"                                            // orange
        ],
        "fill-opacity": 0.35
      }
    });

    map.addLayer({
      id: "erp-outline",
      type: "line",
      source: "combined",
      "source-layer": LAYER_ERP,
      filter: ["in", ["geometry-type"], ["literal", ["Polygon","MultiPolygon"]]],
      paint: { "line-color": "#8a6f00", "line-width": 0.8 }
    });

    // 4) Add Volusia flood-days source (polygon grid cells)
    map.addSource("volusia_flood_days", {
      type: "vector",
      url: FLOOD_PMTILES_URL,
    });

    // Fill layer: 250 m grid cells, colored by bucket, no black outline
    map.addLayer({
      id: "volusia_flood_days-fill",
      type: "fill",
      source: "volusia_flood_days",
      "source-layer": "volusia_flood_days_cells", // must match -l name in tippecanoe
      paint: {
        "fill-color": [
          "match",
          ["get", "bucket"],
          "1-2",    FLOOD_BUCKET_COLORS["1-2"],
          "3-5",    FLOOD_BUCKET_COLORS["3-5"],
          "6-10",   FLOOD_BUCKET_COLORS["6-10"],
          "11-20",  FLOOD_BUCKET_COLORS["11-20"],
          "21-50",  FLOOD_BUCKET_COLORS["21-50"],
          "51-100", FLOOD_BUCKET_COLORS["51-100"],
          "101-200",FLOOD_BUCKET_COLORS["101-200"],
          "201-300",FLOOD_BUCKET_COLORS["201-300"],
          "301-364",FLOOD_BUCKET_COLORS["301-364"],
          "rgba(0,0,0,0)" // fallback: transparent
        ],
        "fill-opacity": 0.7,
        "fill-outline-color": "rgba(0,0,0,0)" // no visible outline
      },
      // we'll update this filter from the bucket checkboxes
      filter: ["in", ["get", "bucket"], ["literal", FLOOD_BUCKETS]]
    });


    // 5) Popups — ERP polygons:
    //    Always show: permit_status, applicant, cur_prmt_id, link, prmt_proj_nm, created_date
    //    If has_builder_addr is true, also show builder_names
    const erpPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: true });

    function fmtDate(v){
      if (!v) return "";
      const m = String(v).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (!m) return String(v);
      const [_, y, mo, d] = m;
      return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }

    function erpHTML(p) {
      if (!p) return "";
      const baseRows = [
        ["Status",    p.permit_status],
        ["Applicant", p.applicant],
        ["Permit ID", p.cur_prmt_id],
        ["Project",   p.prmt_proj_nm],
        ["Created",   fmtDate(p.created_date)],
        ["Link",      p.link && /^https?:\/\//i.test(p.link) ? `<a href="${p.link}" target="_blank" rel="noopener">Open permit</a>` : (p.link||"")]
      ];

      // include builder only if present/flagged
      const rows = [...baseRows];
      if (p.has_builder_addr && p.builder_names) {
        rows.unshift(["Builder", p.builder_names]); // put builder at top
      }

      const htmlRows = rows
        .filter(([,v]) => v !== undefined && v !== null && String(v) !== "")
        .map(([k,v]) => `<tr><td style="padding-right:6px;color:#666;vertical-align:top;">${k}</td><td>${String(v)}</td></tr>`)
        .join("");

      return `
        <div style="font:12px/1.3 system-ui,sans-serif;max-width:300px">
          <div style="font-weight:600;margin-bottom:4px;">ERP Permit</div>
          <table style="border-collapse:collapse;">${htmlRows}</table>
        </div>`;
    }

    function onErpClick(e){
      if (!e.features?.length) return;
      const f = e.features[0];
      erpPopup.setLngLat(e.lngLat).setHTML(erpHTML(f.properties)).addTo(map);
    }

    map.on("click", "erp-fill", onErpClick);
    map.on("click", "erp-outline", onErpClick);

    // -------- ERP visibility toggles (pink/orange) ----------
    const PINK   = "#ff4fa3";
    const ORANGE = "#ff9f1c";
    
    // UI state
    let showBuilder   = true;  // pink
    let showNonBuilder = true; // orange
    
    function computeErpFilter() {
      // Base: only polygons/multipolygons
      const typeFilter = ["in", ["geometry-type"], ["literal", ["Polygon", "MultiPolygon"]]];
    
      // Clauses based on has_builder_addr property
      const clauses = [];
      if (showBuilder)     clauses.push(["==", ["get", "has_builder_addr"], true]);
      if (showNonBuilder)  clauses.push(["!=", ["get", "has_builder_addr"], true]); // false or null
    
      if (clauses.length === 0) {
        // Show nothing (use an impossible condition)
        return ["all", typeFilter, ["==", ["get", "has_builder_addr"], "__never__"]];
      }
      if (clauses.length === 1) {
        return ["all", typeFilter, clauses[0]];
      }
      return ["all", typeFilter, ["any", ...clauses]];
    }
    
    function applyErpFilter() {
      const f = computeErpFilter();
      map.setFilter("erp-fill", f);
      map.setFilter("erp-outline", f);
    }
    
    // Wire up the controls
    const elBuilder = document.getElementById("toggleBuilder");
    const elOther   = document.getElementById("toggleNonBuilder");
    const btnOnly   = document.getElementById("showOnlyBuilder");
    const btnAll    = document.getElementById("showAllErp");
    
    if (elBuilder && elOther && btnOnly && btnAll) {
      elBuilder.addEventListener("change", () => {
        showBuilder = elBuilder.checked;
        applyErpFilter();
      });
      elOther.addEventListener("change", () => {
        showNonBuilder = elOther.checked;
        applyErpFilter();
      });
      btnOnly.addEventListener("click", () => {
        showBuilder = true; showNonBuilder = false;
        elBuilder.checked = true; elOther.checked = false;
        applyErpFilter();
      });
      btnAll.addEventListener("click", () => {
        showBuilder = true; showNonBuilder = true;
        elBuilder.checked = true; elOther.checked = true;
        applyErpFilter();
      });
    }
    
    // Apply once on load so current checkbox state is respected
    applyErpFilter();


    // 6) Popups — Builder points: show matching_grantor1namefull (+ address if present)
    const bldPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: true });

    // Replace your builderHTML function with this:
    function builderHTML(p) {
      const rows = [];
      if (p?.builder)               rows.push(["builder", p.builder]);
      if (p?.address)               rows.push(["address", p.address]);
      if (p?.subdivision)           rows.push(["subdivision", p.subdivision]);
      if (p?.counta_of_attom_id!=null && p.counta_of_attom_id!=="")
                                    rows.push(["counta of attom_id", p.counta_of_attom_id]);
    
      const htmlRows = rows.map(([k,v]) =>
        `<tr><td style="padding-right:6px;color:#666;vertical-align:top;">${k}</td><td>${String(v)}</td></tr>`
      ).join("");
    
      return `
        <div style="font:12px/1.3 system-ui,sans-serif;max-width:300px">
          <div style="font-weight:600;margin-bottom:4px;">Builder Address</div>
          <table style="border-collapse:collapse;">${htmlRows}</table>
        </div>`;
    }

    map.on("click", "builder-points", (e) => {
      if (!e.features?.length) return;
      const f = e.features[0];
      bldPopup.setLngLat(e.lngLat).setHTML(builderHTML(f.properties)).addTo(map);
    });

    // Cursor affordance
    ["builder-points","erp-fill","erp-outline","volusia_flood_days-fill"].forEach(id => {
      map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
    });

    // -------- Flood-day buckets visibility toggles ----------
    let floodSelectedBuckets = new Set(FLOOD_BUCKETS);

    function applyFloodFilter() {
      const list = Array.from(floodSelectedBuckets);
      const filter = ["in", ["get", "bucket"], ["literal", list]];
      map.setFilter("volusia_flood_days-fill", filter);
    }

    // Wire up flood bucket checkboxes
    const bucketIdMap = {
      "1-2":    "bucket_1_2",
      "3-5":    "bucket_3_5",
      "6-10":   "bucket_6_10",
      "11-20":  "bucket_11_20",
      "21-50":  "bucket_21_50",
      "51-100": "bucket_51_100",
      "101-200":"bucket_101_200",
      "201-300":"bucket_201_300",
      "301-364":"bucket_301_364",
    };

    Object.entries(bucketIdMap).forEach(([bucket, elemId]) => {
      const checkbox = document.getElementById(elemId);
      if (!checkbox) return;

      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          floodSelectedBuckets.add(bucket);
        } else {
          floodSelectedBuckets.delete(bucket);
        }
        applyFloodFilter();
      });
    });

    // Apply once on load so the initial state (all checked) is used
    applyFloodFilter();

  });
</script>
</body>
</html>
